version: 2.1

# are reusable packages of configuration elements (commands, jobs, executors) that help simplify your CI/CD pipeline setup.
#They're essentially shared libraries for CircleCI configurations.
#https://circleci.com/developer/orbs
orbs:
  maven: circleci/maven@2.1.1
  browser-tools: circleci/browser-tools@2.2.1
  win: circleci/windows@5.0 # The Windows orb gives you everything you need to start using the Windows executor.

jobs:
  chrome-test:
    docker:
      - image: cimg/openjdk:21.0.5
    steps:
      # Checkout the code from the Branch contains the config.yml
      # https://circleci.com/docs/guides/orchestrate/triggers-overview/#run-a-pipeline-on-commit-to-your-code-repository
      - checkout

      # Install Chrome & Chromedriver
      - run:
          name: Install Chrome and Chromedriver
          command: |
            sudo apt-get update
            sudo apt-get install -y wget
            wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
            rm google-chrome-stable_current_amd64.deb
            google-chrome --version


      # Restore previously cached dependencies
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "pom.xml" }}
            - v1-dependencies-

      #Build the project and download dependencies
      - run:
          name: Build project and download dependencies
          command: mvn dependency:go-offline

      # creates a new cache of your project's dependencies to accelerate future builds.
      - save_cache:
          paths:
            - ~/.m2
          key: v1-dependencies-{{ checksum "pom.xml" }}

      # Run tests (customize the execution command to run the tests on chrome)
      - run:
          name: Run Tests
          command: mvn clean test -Dbrowser=chrome -Dheadless=true -Dtest="%regex[.*Tests.*],com.taf.tests.**.**,com.taf.tests.**"
          environment:
            MAVEN_OPTS: -Xmx3200m
            DISPLAY: ":99"

      #This file is not created in a standard way & causes issues when it comes to uploading test results.
      # so it needs to be deleted before the "store-test-results step".
      - run:
          name: Clean test results
          command: rm -f test-output/target/surefire-reports/testng-results.xml

      # Store the xml test results to the Tests directory of the pipeline
      - store_test_results:
          name: Clean test results
          path: test-output/target/surefire-reports

      # Store the test reports to the TestReports directory of the pipeline (in the Artifacts tab of the pipeline)
      # In this project, this will be the Allure html report
      - store_artifacts:
          path: test-output/reports
          destination: test-reports
          when: always
          retention: 30d

  edge-test:
    executor:
      name: win/default  # Built-in Windows executor
      shell: powershell.exe  # Default shell for all steps
      size: medium  # Windows requires at least medium resource class

    steps:
      - checkout

      # Install Edge browser using Chocolatey
      - run:
          name: Install Microsoft Edge
          command: |
            choco install microsoft-edge -y --no-progress
            Write-Host "Edge version:"
            & "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --version

      # Install matching Edge WebDriver
      - run:
          name: Install Edge WebDriver
          command: |
            $edgeVersion = & "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --version
            $driverVersion = $edgeVersion.Split(".")[0]
            Invoke-WebRequest "https://msedgedriver.azureedge.net/$driverVersion/edgedriver_win64.zip" -OutFile "edgedriver.zip"
            Expand-Archive -Path "edgedriver.zip" -DestinationPath "C:\SeleniumWebDrivers\EdgeDriver" -Force
            $env:PATH += ";C:\SeleniumWebDrivers\EdgeDriver"
            [System.Environment]::SetEnvironmentVariable("PATH", $env:PATH, [System.EnvironmentVariableTarget]::Machine)
            Write-Host "WebDriver installed to C:\SeleniumWebDrivers\EdgeDriver"

      # Install Java and Maven
      - run:
          name: Install Java and Maven
          command: |
            choco install temurin maven -y --no-progress
            refreshenv
            java -version
            mvn --version

      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "pom.xml" }}
            - v1-dependencies-

      - run:
          name: Build project
          command: mvn dependency:go-offline

      - save_cache:
          paths:
            - C:\Users\circleci\.m2
          key: v1-dependencies-{{ checksum "pom.xml" }}

      - run:
          name: Run Tests with Edge
          command: |
            $env:MAVEN_OPTS = "-Xmx3200m"
            mvn clean test -Dbrowser=edge -Dheadless=true -Dwebdriver.edge.driver="C:\SeleniumWebDrivers\EdgeDriver\msedgedriver.exe" -Dtest="%regex[.*Tests.*],com.taf.tests.**.**,com.taf.tests.**"

      - store_test_results:
          path: test-output/target/surefire-reports

      - store_artifacts:
          path: test-output/reports
          destination: test-reports
          when: always
          retention: 30d

  edge-test2:
    docker:
      - image: cimg/openjdk:21.0.5
    steps:
      - checkout

      # Install Edge & Edge driver
      - run:
          name: Install Edge and Edge driver
          command: |
            sudo apt-get update
            sudo apt-get install -y wget gnupg
            # Add Microsoft GPG key
            curl -sSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor | sudo tee /usr/share/keyrings/microsoft-edge.gpg > /dev/null
            # Add Edge repository
            echo "deb [signed-by=/usr/share/keyrings/microsoft-edge.gpg] https://packages.microsoft.com/repos/edge stable main" | sudo tee /etc/apt/sources.list.d/microsoft-edge.list
            # Install Edge
            sudo apt-get update
            sudo apt-get install -y microsoft-edge-stable
            # Verify installation
            microsoft-edge --version

      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "pom.xml" }}
            - v1-dependencies-

      - run:
          name: Build project and download dependencies
          command: mvn dependency:go-offline

      - save_cache:
          paths:
            - ~/.m2
          key: v1-dependencies-{{ checksum "pom.xml" }}

      - run:
          name: Run Tests
          command: mvn clean test -Dbrowser=edge -Dheadless=true -Dtest="%regex[.*Tests.*],com.taf.tests.**.**,com.taf.tests.**"
          environment:
            MAVEN_OPTS: -Xmx3200m
            DISPLAY: ":99"

      - run:
          name: Clean test results
          command: rm -f test-output/target/surefire-reports/testng-results.xml

      - store_test_results:
          name: Clean test results
          path: test-output/target/surefire-reports

      - store_artifacts:
          path: test-output/reports
          destination: test-reports
          when: always
          retention: 30d



workflows:
  version: 2

  #Push-to-branch workflow
  on_push:
    jobs:
      - chrome-test:
          filters:
            branches:
              only:
                - AutomationExercise
      - edge-test:
            filters:
              branches:
                only:
                  - AutomationExercise
      - edge-test2:
          filters:
            branches:
              only:
                - AutomationExercise

  #Nightly workflow
  nightly:
    triggers:
      - schedule:
          cron: "0 0 * * *"
          filters:
            branches:
              only:
                - AutomationExercise
    jobs:
      - chrome-test
      - edge-test