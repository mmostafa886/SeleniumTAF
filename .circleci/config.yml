version: 2.1

orbs:
  maven: circleci/maven@2.1.1
  browser-tools: circleci/browser-tools@2.2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/openjdk:21.0.5

    steps:
      - checkout

      # Fixed browser tools installation
      - run:
          name: Install Chrome and Chromedriver
          command: |
            sudo apt-get update
            sudo apt-get install -y wget
            wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
            rm google-chrome-stable_current_amd64.deb
            google-chrome --version

      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "pom.xml" }}
            - v1-dependencies-


      - run:
          name: Build project and download dependencies
          command: mvn dependency:go-offline

      - save_cache:
          paths:
            - ~/.m2
          key: v1-dependencies-{{ checksum "pom.xml" }}

      - run:
          name: Run Tests
          command: mvn clean test -Dbrowser=chrome -Dheadless=true -Dtest="%regex[.*Tests.*],com.taf.tests.**.**,com.taf.tests.**"
          environment:
            MAVEN_OPTS: -Xmx3200m
            DISPLAY: ":99"

      - store_test_results:
          path: target/surefire-reports

      - store_artifacts:
          path: target/surefire-reports
          destination: test-reports
          when: always
          retention: 30d  # Keep for 30 days

workflows:
  version: 2
  main_workflow:
    # Handle both push and manual triggers
    when:
      or:
        - not: { equal: [ << pipeline.parameters.run_manual >>, true ] }  # Push trigger
        - equal: [ << pipeline.parameters.run_manual >>, true ]          # Manual trigger

    # Scheduled trigger configuration
    triggers:
      - schedule:
          cron: "0 0 * * *"
          filters:
            branches:
              only:
                - AutomationExercise

    jobs:
      - build-and-test:
          filters:
            branches:
              only:
                - AutomationExercise