  edge-test:
    executor:
      name: win/default
      shell: powershell.exe
      size: medium
    steps:
        - checkout

      # Install Edge and WebDriver
        - run:
            name: Install Microsoft Edge
            shell: powershell.exe
            command: |
              # Install Edge using Chocolatey
              choco install microsoft-edge -y --no-progress
              
              # Verify installation
              $edgePath = "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe"
              if (-not (Test-Path $edgePath)) {
                Write-Error "Edge installation failed!"
                exit 1
              }
              Write-Host "Edge installed at: $edgePath"

        - run:
            name: Install EdgeDriver (Fixed)
            shell: powershell.exe
            command: |
              # Create directory with full permissions
              $driverDir = "C:\SeleniumWebDrivers\EdgeDriver"
              Remove-Item -Path $driverDir -Recurse -Force -ErrorAction SilentlyContinue
              New-Item -ItemType Directory -Path $driverDir -Force
              icacls $driverDir /grant "Everyone:(OI)(CI)F"

              # Get exact Edge version
              $edgePath = "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe"
              $edgeVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($edgePath).FileVersion
              $majorVersion = $edgeVersion.Split('.')[0]

              Write-Host "Downloading EdgeDriver for version $majorVersion"

              # Download with retry logic
              $retryCount = 0
              $maxRetries = 3
              $success = $false

              do {
                try {
                  $driverUrl = "https://msedgedriver.azureedge.net/$majorVersion/edgedriver_win64.zip"
                  Invoke-WebRequest $driverUrl -OutFile "$env:TEMP\edgedriver.zip"
                  $success = $true
                } catch {
                  $retryCount++
                  if ($retryCount -ge $maxRetries) {
                    Write-Error "Failed to download EdgeDriver after $maxRetries attempts"
                    exit 1
                  }
                  Start-Sleep -Seconds 5
                }
              } while (-not $success -and $retryCount -lt $maxRetries)

              # Extract and verify
              Expand-Archive -Path "$env:TEMP\edgedriver.zip" -DestinationPath $driverDir -Force
              Remove-Item -Path "$env:TEMP\edgedriver.zip" -Force

              # Set permissions on executable
              $driverPath = "$driverDir\msedgedriver.exe"
              icacls $driverPath /grant "Everyone:F"

              # Verify installation
              if (-not (Test-Path $driverPath)) {
                Write-Error "EdgeDriver verification failed - file not found"
                Get-ChildItem $driverDir -Recurse | Format-Table FullName
                exit 1
              }

              # Add debug output
              Write-Host "EdgeDriver successfully installed:"
              Get-Item $driverPath | Format-List *
              & $driverPath --version

              # Add to system PATH
              $env:Path += ";$driverDir"
              [System.Environment]::SetEnvironmentVariable("Path", $env:Path, "Machine")

        - run:
            name: Verify WebDriver Permissions
            shell: powershell.exe
            command: |
              $driverPath = "C:\SeleniumWebDrivers\EdgeDriver\msedgedriver.exe"
              $acl = Get-Acl $driverPath
              Write-Host "WebDriver permissions:"
              $acl.Access | Format-Table IdentityReference,FileSystemRights,AccessControlType

        - run:
            name: Copy WebDriver to Project
            shell: powershell.exe
            command: |
              Copy-Item "C:\SeleniumWebDrivers\EdgeDriver\msedgedriver.exe" -Destination "$env:CIRCLE_WORKING_DIRECTORY\msedgedriver.exe"
              $env:Path += ";$env:CIRCLE_WORKING_DIRECTORY"
      # Install Java and Maven
        - run:
            name: Install JDK and Maven
            shell: powershell.exe
            command: |
              choco install temurin21jdk maven -y --no-progress
              refreshenv
              java -version
              mvn --version

      # Dependency management
        - restore_cache:
            keys:
              - v1-dependencies-{{ checksum "pom.xml" }}
              - v1-dependencies-

        - run:
            name: Build project
            shell: powershell.exe
            command: mvn dependency:go-offline

        - save_cache:
            paths:
              - C:\Users\circleci\.m2
            key: v1-dependencies-{{ checksum "pom.xml" }}

    # Run tests with proper WebDriver path
        - run:
            name: Run Edge Tests
            shell: powershell.exe
            command: |
              $driverPath = "C:\SeleniumWebDrivers\EdgeDriver\msedgedriver.exe"
              if (-not (Test-Path $driverPath)) {
                Write-Error "EdgeDriver not found at $driverPath"
                exit 1
              }
              
              $env:MAVEN_OPTS = "-Xmx3200m"
              mvn clean test `
                -Dwebdriver.edge.driver="$driverPath" `
                -Dbrowser=edge `
                -Dheadless=true `
                -Dtest=LoginTest

    # Test reporting
        - store_test_results:
            path: test-output/target/surefire-reports

        - store_artifacts:
            path: test-output/reports
            destination: test-reports
            when: always
            retention: 30d


