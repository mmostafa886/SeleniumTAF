  edge-test:
    executor:
      name: win/default
      shell: powershell.exe
      resource_class: windows.medium
    steps:
        - checkout

      # Install Edge and WebDriver
        - run:
            name: Install Microsoft Edge
            shell: powershell.exe
            command: |
              choco install microsoft-edge -y --no-progress
              Write-Host "Edge version:"
              & "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --version

        - run:
            name: Install EdgeDriver
            shell: powershell.exe
            command: |
              $edgeVersion = (& "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --version).Split('.')[0]
              $driverUrl = "https://msedgedriver.azureedge.net/$edgeVersion/edgedriver_win64.zip"
              
              # Clean previous installation
              Remove-Item -Path "C:\SeleniumWebDrivers\EdgeDriver" -Recurse -Force -ErrorAction SilentlyContinue
              New-Item -ItemType Directory -Path "C:\SeleniumWebDrivers\EdgeDriver" -Force
              
              # Download and extract
              Invoke-WebRequest $driverUrl -OutFile "edgedriver.zip"
              Expand-Archive -Path "edgedriver.zip" -DestinationPath "C:\SeleniumWebDrivers\EdgeDriver" -Force
              Remove-Item -Path "edgedriver.zip" -Force
              
              # Add to PATH
              $env:Path += ";C:\SeleniumWebDrivers\EdgeDriver"
              [System.Environment]::SetEnvironmentVariable("Path", $env:Path, [System.EnvironmentVariableTarget]::Machine)
              
              # Verify
              if (-not (Test-Path "C:\SeleniumWebDrivers\EdgeDriver\msedgedriver.exe")) {
                Write-Error "EdgeDriver installation failed!"
                exit 1
              }
              & "C:\SeleniumWebDrivers\EdgeDriver\msedgedriver.exe" --version

      # Install Java and Maven
        - run:
            name: Install JDK and Maven
            shell: powershell.exe
            command: |
              choco install temurin21jdk maven -y --no-progress
              refreshenv
              java -version
              mvn --version

      # Dependency management
        - restore_cache:
            keys:
              - v1-dependencies-{{ checksum "pom.xml" }}
              - v1-dependencies-

        - run:
            name: Build project
            shell: powershell.exe
            command: mvn dependency:go-offline

        - save_cache:
            paths:
              - C:\Users\circleci\.m2
            key: v1-dependencies-{{ checksum "pom.xml" }}

    # Run tests with proper WebDriver path
        - run:
            name: Run Edge Tests
            shell: powershell.exe
            command: |
              $driverPath = "C:\SeleniumWebDrivers\EdgeDriver\msedgedriver.exe"
              if (-not (Test-Path $driverPath)) {
                Write-Error "EdgeDriver not found at $driverPath"
                exit 1
              }
              
              $env:MAVEN_OPTS = "-Xmx3200m"
              mvn clean test `
                -Dwebdriver.edge.driver="$driverPath" `
                -Dbrowser=edge `
                -Dheadless=true `
                -Dtest="%regex[.*Tests.*],com.taf.tests.**.**,com.taf.tests.**"

    # Test reporting
        - store_test_results:
            path: test-output/target/surefire-reports

        - store_artifacts:
            path: test-output/reports
            destination: test-reports
            when: always
            retention: 30d


