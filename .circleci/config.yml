  edge-test:
docker:
  - image: cimg/openjdk:11.0.21-browsers
    working_directory: ~/project
    environment:
      MAVEN_OPTS: -Xmx3200m
    steps:
      - checkout
      - run:
          name: Install Edge Browser and WebDriver
          command: |
            curl https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor > microsoft.gpg
            sudo install -o root -g root -m 644 microsoft.gpg /etc/apt/trusted.gpg.d/
            sudo sh -c 'echo "deb [arch=amd64] https://packages.microsoft.com/repos/edge stable main" > /etc/apt/sources.list.d/microsoft-edge-dev.list'
            sudo rm microsoft.gpg
            sudo apt update
            sudo apt install -y microsoft-edge-dev
            # Find the latest stable EdgeDriver version from https://developer.microsoft.com/en-us/microsoft-edge/tools/webdriver/
            # Replace 127.0.2555.3 with the actual latest stable version
            wget https://msedgedriver.azureedge.net/127.0.2555.3/edgedriver_linux64.zip -P ~/
            unzip ~/edgedriver_linux64.zip -d ~/
            rm ~/edgedriver_linux64.zip
            sudo mv -f ~/msedgedriver /usr/local/share/
            sudo chmod 777 /usr/local/share/msedgedriver
            sudo ln -s /usr/local/share/msedgedriver /usr/local/bin/msedgedriver

      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "pom.xml" }}
            - v1-dependencies-
            -
      - run: mvn dependency:go-offline

      - save_cache:
          paths:
            - ~/.m2
          key: v1-dependencies-{{ checksum "pom.xml" }}


      - run:
          name: Run Selenium tests using TestNG with Edge
          command: |
            mvn clean test

      - store_test_results:
          path: test-output/target/surefire-reports

      - store_artifacts:
          path: test-output/reports
          destination: test-reports
          when: always
          retention: 30d

