  edge-test:
    executor: windows-edge
    steps:
      - checkout

      # Use the browser-tools orb to install Edge and the Edge driver
      - browser-tools/install-browser-tools:
          browser: msedge
          install-chromedriver: false
          install-geckodriver: false
          install-msedgedriver: true

      # Restore previously cached dependencies
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "pom.xml" }}
            - v1-dependencies-

      # Build the project and download dependencies
      - run:
          name: Build project and download dependencies
          command: mvn dependency:go-offline

      # Creates a new cache of your project's dependencies
      - save_cache:
          paths:
            - ~/.m2
          key: v1-dependencies-{{ checksum "pom.xml" }}

      # Run tests with the provided configuration
      - run:
          name: Run Edge Tests
          command: |
            mvn clean test -Dbrowser=edge -Dheadless=true -Dtest=LoginTest

      # Clean the testng-results.xml file
      - run:
          name: Clean test results
          command: |
            if (Test-Path "test-output\target\surefire-reports\testng-results.xml") {
                Remove-Item "test-output\target\surefire-reports\testng-results.xml"
            }

      # Store the xml test results
      - store_test_results:
          path: test-output/target/surefire-reports

      # Store the Allure html report
      - store_artifacts:
          path: test-output/reports
          destination: test-reports
          when: always
          retention: 30d

