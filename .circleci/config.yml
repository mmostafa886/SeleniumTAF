  edge-test:
    executor:
      name: win/server-2022  # Built-in Windows executor
      shell: powershell.exe  # Default shell for all steps
      size: medium  # Windows requires at least medium resource class

    steps:
      - checkout

      # Install Edge browser using Chocolatey
      - run:
          name: Install Microsoft Edge
          command: |
            choco upgrade microsoft-edge -y --no-progress
            $edgePath = "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe"
            Write-Host "Edge version:"
            & $edgePath --version

      # Install matching Edge WebDriver
      - run:
          name: Install Edge WebDriver
          command: |
            $edgeVersion = & "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --version
            $driverVersion = $edgeVersion.Split(".")[0]
            Invoke-WebRequest "https://msedgedriver.azureedge.net/$driverVersion/edgedriver_win64.zip" -OutFile "edgedriver.zip"
            Expand-Archive -Path "edgedriver.zip" -DestinationPath "C:\SeleniumWebDrivers\EdgeDriver" -Force
            $env:PATH += ";C:\SeleniumWebDrivers\EdgeDriver"
            [System.Environment]::SetEnvironmentVariable("PATH", $env:PATH, [System.EnvironmentVariableTarget]::Machine)
            Write-Host "WebDriver installed to C:\SeleniumWebDrivers\EdgeDriver"

      # Install Java and Maven
      - run:
          name: Install Java and Maven
          command: |
            choco install temurin maven -y --no-progress
            refreshenv
            java -version
            mvn --version

      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "pom.xml" }}
            - v1-dependencies-

      - run:
          name: Build project
          command: mvn dependency:go-offline

      - save_cache:
          paths:
            - C:\Users\circleci\.m2
          key: v1-dependencies-{{ checksum "pom.xml" }}

      - run:
          name: Run Tests with Edge
          command: |
            $env:MAVEN_OPTS = "-Xmx3200m"
            $env:DISPLAY = ":99"
            mvn clean test -Dbrowser=edge -Dheadless=true -Dtest=LoginTest -X

      - store_test_results:
          path: test-output/target/surefire-reports

      - store_artifacts:
          path: test-output/reports
          destination: test-reports
          when: always
          retention: 30d


