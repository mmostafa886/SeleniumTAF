version: 2.1

# Reusable packages of configuration elements (commands, jobs, executors) that help simplify your CI/CD pipeline setup.
# They're essentially shared libraries for CircleCI configurations.
# https://circleci.com/developer/orbs
orbs:
  maven: circleci/maven@2.1.1
  browser-tools: circleci/browser-tools@2.2.1
  win: circleci/windows@5.0 # The Windows orb gives you everything you need to start using the Windows executor.

# The custom executor now directly references the orb's executor
# and then defines any custom settings.
executors:
  windows-edge:
    win/default:
      shell: powershell.exe
      size: medium
      environment:
        EDGE_DRIVER_PATH: "C:/SeleniumWebDrivers/EdgeDriver/msedgedriver.exe"

