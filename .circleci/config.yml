version: 2.1

# Reusable packages of configuration elements (commands, jobs, executors) that help simplify your CI/CD pipeline setup.
# They're essentially shared libraries for CircleCI configurations.
# https://circleci.com/developer/orbs
orbs:
  maven: circleci/maven@2.1.1
  browser-tools: circleci/browser-tools@2.2.1

jobs:
  chrome-test:
    docker:
      - image: cimg/openjdk:21.0.5
    steps:
      - checkout

      # Use the browser-tools orb to install Chrome and Chromedriver
      - browser-tools/install-browser-tools:
          browser: chrome
          install-geckodriver: false
          install-msedgedriver: false

      # The maven orb's test command handles caching and test execution
      - maven/test:
          test-command: mvn clean test -Dbrowser=chrome -Dheadless=true -Dtest=LoginTest
          # The maven/test command also handles caching automatically

      # Clean the testng-results.xml file
      - run:
          name: Clean test results
          command: rm -f test-output/target/surefire-reports/testng-results.xml

      # Store the xml test results
      - store_test_results:
          path: test-output/target/surefire-reports

      # Store the Allure html report
      - store_artifacts:
          path: test-output/reports
          destination: test-reports
          when: always
          retention: 30d

workflows:
  version: 2

  on_push:
    jobs:
      - chrome-test:
          filters:
            branches:
              only:
                - AutomationExercise

  nightly:
    triggers:
      - schedule:
          cron: "0 0 * * *"
          filters:
            branches:
              only:
                - AutomationExercise
    jobs:
      - chrome-test