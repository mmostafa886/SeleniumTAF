# JUnit Platform Configuration
# This file configures JUnit 5 test execution behavior

# ========================================
# Parallel Execution Configuration
# ========================================
# Enable parallel execution (set to true or false)
junit.jupiter.execution.parallel.enabled=false

# Parallel mode: same_thread, concurrent
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent

# Parallelism strategy: fixed, dynamic, custom
junit.jupiter.execution.parallel.config.strategy=fixed

# Number of parallel threads (default=1)
junit.jupiter.execution.parallel.config.fixed.parallelism=1

# Maximum pool size for dynamic strategy
# junit.jupiter.execution.parallel.config.dynamic.factor=1.0

# ========================================
# Test Instance Lifecycle
# ========================================
# Options: per_class, per_method (default)
# per_class allows @BeforeAll/@AfterAll to be non-static
junit.jupiter.testinstance.lifecycle.default=per_method

# ========================================
# Test Method Order
# ========================================
# Default ordering: Random, DisplayName, OrderAnnotation, MethodName
# junit.jupiter.testmethod.order.default=org.junit.jupiter.api.MethodOrderer$OrderAnnotation

# ========================================
# Extensions Auto-Detection
# ========================================
# Automatically detect and register extensions
junit.jupiter.extensions.autodetection.enabled=true

# ========================================
# Display Name Generation
# ========================================
# Options: Standard, Simple, ReplaceUnderscores
junit.jupiter.displayname.generator.default=org.junit.jupiter.api.DisplayNameGenerator$ReplaceUnderscores

# ========================================
# Conditional Test Execution
# ========================================
# Fail on disabled tests
# junit.jupiter.conditions.deactivate=*

# ========================================
# Timeout Configuration
# ========================================
# Default timeout for all test methods (e.g., 10m, 5s)
# junit.jupiter.execution.timeout.default=10m
# junit.jupiter.execution.timeout.mode=enabled_on_debug

# ========================================
# Tag Configuration
# ========================================
# Include tests with specific tags
# junit.platform.tags.include=smoke,regression

# Exclude tests with specific tags
# junit.platform.tags.exclude=

# ========================================
# Test Discovery
# ========================================
# Default test class pattern
# junit.platform.testclass.pattern=.*[Tt]ests?

# ========================================
# Logging Configuration
# ========================================
# Log level for JUnit Platform: OFF, ERROR, WARN, INFO, DEBUG, TRACE
# java.util.logging.SimpleFormatter.format=%1$tF %1$tT %4$s %5$s%6$s%n
